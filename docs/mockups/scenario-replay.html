<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景回放 · UI 高保真原型 v2 · zq-platform</title>
<style>
/* ================= 设计令牌（对齐 Element Plus / Vben Admin） ================= */
:root{
  --p:#409EFF; --p-h:#66b1ff; --p-l:#ecf5ff; --p-b:#d9ecff;
  --ok:#67C23A; --ok-l:#f0f9eb; --ok-b:#e1f3d8;
  --warn:#E6A23C; --warn-l:#fdf6ec; --warn-b:#faecd8;
  --dg:#F56C6C; --dg-l:#fef0f0; --dg-b:#fde2e2;
  --info:#909399; --info-l:#f4f4f5; --info-b:#e9e9eb;
  --teal:#00A6A6; --teal-l:#e6f7f7; --teal-b:#cceeee;
  --purple:#8B5CF6; --purple-l:#f3efff; --purple-b:#e4dcfb;
  --border:#dcdfe6; --border-l:#ebeef5; --border-ll:#f2f4f8;
  --t1:#303133; --t2:#606266; --t3:#909399; --t4:#c0c4cc;
  --bg:#f5f7fa; --card:#fff;
  --sb:#131822; --sb-t:#8b93a5;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;font-size:14px;color:var(--t1);background:var(--bg);overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;outline:none}
svg{flex:none;display:inline-block;vertical-align:-3px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9cdd6;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ================= 应用骨架 ================= */
.app{display:flex;height:100vh}
.sidebar{width:224px;background:var(--sb);display:flex;flex-direction:column;flex:none}
.sb-logo{height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff;font-weight:600;font-size:15px;letter-spacing:.5px}
.sb-logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#409EFF,#2b7fd4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.sb-logo small{color:var(--sb-t);font-weight:400;font-size:11px;margin-left:auto}
.sb-scroll{flex:1;overflow-y:auto;padding:6px 10px 20px}
.sb-scroll::-webkit-scrollbar-thumb{background:#2a3245}
.sb-group{color:#5d6575;font-size:12px;padding:14px 10px 6px;letter-spacing:.5px}
.sb-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:6px;color:#b7bdc9;font-size:13.5px;cursor:pointer;user-select:none;margin-bottom:2px}
.sb-item:hover{background:rgba(255,255,255,.06);color:#e6e9ef}
.sb-item.on{background:linear-gradient(90deg,rgba(64,158,255,.22),rgba(64,158,255,.10));color:#5aabff;font-weight:600}
.sb-item .new-badge{margin-left:auto;background:var(--dg);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:50px;background:#fff;border-bottom:1px solid var(--border-l);display:flex;align-items:center;padding:0 20px;gap:8px;flex:none}
.crumb{color:var(--t3);font-size:13px}
.crumb b{color:var(--t1);font-weight:600}
.crumb .sep{margin:0 8px;color:var(--t4)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--t2)}
.top-right .ic-btn{color:var(--t3);cursor:pointer;display:flex}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#409EFF,#67C23A);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600}
.content{flex:1;overflow-y:auto;padding:14px 18px;position:relative}
.view{display:none}
.view.show{display:block}

/* ================= 通用组件 ================= */
.card{background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--border-ll)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 15px;border-radius:4px;border:1px solid var(--border);background:#fff;color:var(--t2);font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{color:var(--p);border-color:var(--p-b);background:var(--p-l)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p-h);border-color:var(--p-h)}
.btn.dg{color:var(--dg);border-color:var(--dg-b);background:var(--dg-l)}
.btn.dg:hover{background:var(--dg);border-color:var(--dg);color:#fff}
.btn.ghost-dg{background:#fff;color:var(--dg);border-color:var(--dg-b)}
.btn.sm{height:26px;padding:0 11px;font-size:12.5px;border-radius:4px}
.btn.text{border:none;background:none;color:var(--p);padding:0 6px}
.btn.text:hover{background:none;color:var(--p-h)}
.btn.text.dg{color:var(--dg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{height:32px;border:1px solid var(--border);border-radius:4px;padding:0 10px;font-size:13.5px;color:var(--t1);background:#fff;width:100%;transition:.15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(64,158,255,.12)}
.inp::placeholder{color:var(--t4)}
textarea.inp{height:auto;padding:8px 10px;resize:none;line-height:1.6}
.sel{height:32px;border:1px solid var(--border);border-radius:4px;padding:0 8px 0 10px;font-size:13.5px;color:var(--t1);background:#fff;display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap}
.sel:hover{border-color:var(--t4)}
.sel svg{color:var(--t4)}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:4px;font-size:12px;white-space:nowrap;line-height:1}
.tag.sm{height:20px;padding:0 7px;font-size:11px}
.t-blue{color:var(--p);background:var(--p-l);border:1px solid var(--p-b)}
.t-green{color:var(--ok);background:var(--ok-l);border:1px solid var(--ok-b)}
.t-orange{color:var(--warn);background:var(--warn-l);border:1px solid var(--warn-b)}
.t-red{color:var(--dg);background:var(--dg-l);border:1px solid var(--dg-b)}
.t-gray{color:var(--info);background:var(--info-l);border:1px solid var(--info-b)}
.t-teal{color:var(--teal);background:var(--teal-l);border:1px solid var(--teal-b)}
.t-purple{color:var(--purple);background:var(--purple-l);border:1px solid var(--purple-b)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--dg);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,108,108,.5)}70%{box-shadow:0 0 0 6px rgba(245,108,108,0)}100%{box-shadow:0 0 0 0 rgba(245,108,108,0)}}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{background:#f7f9fc;color:var(--t3);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--border-l);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border-l);color:var(--t2);vertical-align:middle}
.tbl tbody tr:hover{background:#f7f9fc}
.mono{font-family:var(--mono);font-size:12.5px}
.checkbox{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;display:inline-block;vertical-align:-2px;background:#fff;cursor:pointer;flex:none}
.checkbox.on{background:var(--p);border-color:var(--p);position:relative}
.checkbox.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.switch{width:34px;height:18px;border-radius:9px;background:var(--border);position:relative;display:inline-block;transition:.2s;cursor:pointer;flex:none}
.switch.on{background:var(--p)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:18px}
.pop{position:fixed;background:#fff;border-radius:6px;box-shadow:var(--shadow-lg);border:1px solid var(--border-l);padding:5px;min-width:150px;z-index:900;max-height:70vh;overflow-y:auto}
.pop .pg{font-size:11px;color:var(--t4);padding:7px 12px 3px;letter-spacing:.5px}
.pop .pi{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:4px;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.pop .pi:hover{background:var(--p-l);color:var(--p)}
.pop .pi.dg{color:var(--dg)}
.pop .pi.dg:hover{background:var(--dg-l)}
.pop .pi.dis{color:var(--t4);cursor:not-allowed}
.pop .pi.dis:hover{background:none;color:var(--t4)}
.pop .pdiv{height:1px;background:var(--border-l);margin:4px 6px}
.pop .pnote{font-size:11px;color:var(--t4);padding:6px 12px 4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:800;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);width:560px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;animation:popIn .18s}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}}
.m-head{display:flex;align-items:center;padding:18px 22px 0;font-size:16px;font-weight:600}
.m-head .x{margin-left:auto;color:var(--t3);cursor:pointer;display:flex;padding:4px;border-radius:4px}
.m-head .x:hover{background:var(--info-l);color:var(--t1)}
.m-body{padding:16px 22px;overflow-y:auto}
.m-foot{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:10px}
.frm-row{margin-bottom:16px}
.frm-lab{font-size:13px;color:var(--t2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.frm-lab .req{color:var(--dg)}
.frm-hint{font-size:12px;color:var(--t4);margin-top:6px;display:flex;align-items:center;gap:4px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;font-size:13px;padding:10px 18px;border-radius:6px;box-shadow:var(--shadow-lg);z-index:1000;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.25s;max-width:70vw}
#toast.show{opacity:1}
#toast.ok svg{color:#8ee68a}#toast.err svg{color:#ff9c9c}
.ubadge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:600;color:#fff;flex:none}
.ubadge.a{background:#409EFF}.ubadge.b{background:#67C23A}.ubadge.c{background:#8B5CF6}.ubadge.d{background:#E6A23C}
.u-dot{width:8px;height:8px;border-radius:50%;flex:none}

/* ================= 假设备画面（480×270 逻辑坐标） ================= */
.scr{position:relative;overflow:hidden;background:#e8ebf0;border-radius:4px}
.scr-in{width:480px;height:270px;position:absolute;top:0;left:0;transform-origin:0 0;background:#fff}
.scr-in .ab{position:absolute}
.bch{left:0;top:0;width:480px;height:26px;background:#eef1f5;border-bottom:1px solid #e2e6ec}
.bch .dot{width:8px;height:8px;border-radius:50%;position:absolute;top:9px}
.bch .d1{left:10px;background:#ff5f57}.bch .d2{left:24px;background:#febc2e}.bch .d3{left:38px;background:#28c840}
.burl{left:64px;right:64px;top:5px;height:17px;background:#fff;border-radius:9px;font-size:10px;color:#7a8494;display:flex;align-items:center;padding:0 10px}
.nav{left:0;top:26px;bottom:0;width:96px;background:#fafbfd;border-right:1px solid #eef1f5}
.nav .lg{left:10px;top:8px;width:14px;height:14px;border-radius:4px;background:var(--p)}
.ni{left:0;width:96px;height:28px;line-height:28px;padding-left:14px;font-size:11.5px;color:#5f6b7a}
.ni.on{background:var(--p-l);color:var(--p);box-shadow:inset 2px 0 0 var(--p)}
.mt{left:96px;top:26px;right:0;bottom:0;background:#f7f9fc}
.httl{font-size:13px;font-weight:600;color:var(--t1)}
.pbtn{height:24px;line-height:24px;padding:0 10px;background:var(--p);color:#fff;font-size:10.5px;border-radius:4px}
.lrow{height:32px;background:#fff;border:1px solid #eef1f5;border-radius:5px;font-size:11px;color:var(--t2);display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.lrow .st{font-size:10px;padding:1px 7px;border-radius:8px}
.lrow .st.ok{color:var(--ok);background:var(--ok-l)}
.lrow .st.gray{color:var(--t3);background:var(--info-l)}
.dim{left:0;top:0;width:480px;height:270px;background:rgba(15,20,30,.45)}
.modal2{background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mtl{font-size:12.5px;font-weight:600;color:var(--t1)}
.flab{font-size:10.5px;color:var(--t2)}
.fin{height:24px;background:#fff;border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--t1);display:flex;align-items:center;padding:0 8px}
.fin.focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(64,158,255,.14)}
.caret{width:1px;height:12px;background:var(--p);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sw2{width:28px;height:15px;border-radius:8px;background:var(--p);position:relative}
.sw2::after{content:"";position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#fff}
.btn2{height:24px;line-height:24px;text-align:center;font-size:10.5px;border-radius:4px;padding:0 12px}
.btn2.g{background:#fff;border:1px solid var(--border);color:var(--t2)}
.btn2.p{background:var(--p);color:#fff}
.ttop{left:0;top:0;width:480px;height:30px;background:#1a1f28;color:#c9d2de;font-size:11px;display:flex;align-items:center;padding:0 12px;gap:10px}
.ttop .trec{margin-left:auto;font-size:10px;color:#ffd66b;background:rgba(255,214,107,.12);padding:2px 8px;border-radius:8px}
.tile{background:#22262e;border-radius:5px;overflow:hidden}
.tile .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600}
.tile .av.az{background:#3f6fe0}.tile .av.ag{background:#2f9e6a}
.tile .tname{position:absolute;bottom:6px;left:10px;font-size:10px;color:#aeb6c2}
.tbar{left:0;bottom:0;width:480px;height:34px;background:#1a1f28;display:flex;align-items:center;justify-content:center;gap:4px}
.tbar .tb{font-size:10.5px;color:#c9d2de;padding:5px 9px;border-radius:4px}
.tbar .tb.on{color:#5aabff;background:rgba(64,158,255,.15)}
.tbar .tb.off{color:#ff8b8b;background:rgba(245,108,108,.14)}
.scr-in.dark{background:#1f242c}
.wtb{left:0;top:0;width:480px;height:24px;background:#171b22;color:#aeb6c2;font-size:10.5px;display:flex;align-items:center;padding:0 10px}
.wtb .wbtns{margin-left:auto;color:#6b7382;letter-spacing:6px;font-size:10px}
.wnav{left:0;top:24px;bottom:0;width:64px;background:#171b22}
.wni{height:30px;line-height:30px;text-align:center;font-size:10.5px;color:#7a8494}
.wni.on{color:#5aabff;background:rgba(64,158,255,.12)}
.wmt{left:64px;top:24px;right:0;bottom:0;padding:12px;background:#1f242c}
.wttl{font-size:12px;color:#e2e7ee;font-weight:600}
.wrow{height:26px;background:#262c36;border-radius:4px;font-size:10px;color:#9aa3b0;display:flex;align-items:center;padding:0 8px;margin-bottom:5px}
.wrow .st{margin-left:auto;font-size:9.5px;color:#57c98a}
.wfin{height:24px;background:#262c36;border:1px solid #3a4150;border-radius:4px;font-size:10.5px;color:#e2e7ee;display:flex;align-items:center;padding:0 8px}
.wfin.focus{border-color:var(--p)}
.wbtn{height:25px;line-height:25px;text-align:center;background:var(--p);color:#fff;font-size:10.5px;border-radius:4px}
.wstatus{position:absolute;bottom:8px;right:12px;font-size:9.5px;color:#6b7382}
.lob-c{left:0;top:70px;width:480px;text-align:center}
.lob-ic{width:44px;height:44px;border-radius:50%;background:var(--warn-l);color:var(--warn);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.lob-t{font-size:15px;font-weight:600;color:var(--t1)}
.lob-s{font-size:11px;color:var(--t3);margin-top:6px}
.spin{width:16px;height:16px;border:2px solid var(--p-b);border-top-color:var(--p);border-radius:50%;margin:12px auto 0;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.share-bar{left:0;top:0;width:480px;height:26px;background:#2f6fe0;color:#fff;font-size:10.5px;display:flex;align-items:center;padding:0 12px}
.share-bar .stop{margin-left:auto;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:8px;font-size:10px}
.docline{height:9px;border-radius:3px;background:#e8eaf0;margin-bottom:8px}
.thumb{position:relative;overflow:hidden;background:#dde2ea;border-radius:4px;border:1px solid rgba(0,0,0,.08);flex:none;display:inline-block;vertical-align:middle}
.mshot{position:absolute;right:-5px;bottom:-5px;background:var(--t1);color:#fff;font-size:9.5px;padding:1px 6px;border-radius:8px;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* ================= 页面：场景列表 ================= */
.filter-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap}
.filter-bar .inp{width:190px}
.filter-bar .spacer{flex:1}
.page-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;color:var(--t3);font-size:13px}
.pg{min-width:26px;height:26px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--t2);cursor:pointer}
.pg:hover{background:var(--p-l);color:var(--p)}
.pg.on{background:var(--p);color:#fff}
.users-cell{display:flex;gap:6px;align-items:center}
.uchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:4px;font-size:11.5px;border:1px solid}
.uchip.a{color:#409EFF;background:#ecf5ff;border-color:#d9ecff}
.uchip.b{color:#67C23A;background:#f0f9eb;border-color:#e1f3d8}
.uchip.c{color:#8B5CF6;background:#f3efff;border-color:#e4dcfb}
.uchip.d{color:#E6A23C;background:#fdf6ec;border-color:#faecd8}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.scene-name{color:var(--t1);font-weight:600;cursor:pointer}
.scene-name:hover{color:var(--p)}
.rec-note{display:inline-flex;align-items:center;gap:5px;color:var(--dg);font-size:11.5px;margin-left:8px}

/* ================= 页面：录制工作台 ================= */
.rec-topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;margin-bottom:12px}
.rec-title{font-size:16px;font-weight:600}
.rec-state{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;font-weight:600}
.rec-state.rec{background:var(--dg-l);color:var(--dg);border:1px solid var(--dg-b)}
.rec-state.pause{background:var(--warn-l);color:var(--warn);border:1px solid var(--warn-b)}
.rec-timer{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:1px}
.rec-topbar .grow{flex:1}
.dev-note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3)}
.utabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.utab{display:flex;align-items:center;gap:9px;height:42px;padding:0 16px;background:#fff;border:1px solid var(--border-l);border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--t2);box-shadow:0 1px 3px rgba(0,0,0,.04);flex:none;transition:.15s}
.utab:hover{border-color:var(--p-b)}
.utab.on{border-color:var(--p);background:var(--p-l);color:var(--t1);font-weight:600}
.utab .pav{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}

.panel{overflow:hidden;display:flex;flex-direction:column}

.panel-h .pav{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.panel-h .pav.a{background:#409EFF}.panel-h .pav.b{background:#67C23A}.panel-h .pav.c{background:#8B5CF6}.panel-h .pav.d{background:#E6A23C}
.panel-h .pname{font-weight:600;font-size:13.5px}

.panel-h .hint{font-size:11.5px;color:var(--t4)}
.panel-body{position:relative;background:#0e1116;cursor:crosshair;height:50vh;display:flex;align-items:center;justify-content:center}

.timeline-card{margin:12px 0 14px}
.tl-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-l)}
.tl-head .tt{font-weight:600;font-size:14px}
.tl-head .cnt{color:var(--t3);font-size:12px;margin-left:10px}
.tl-body{height:224px;overflow-y:auto}
.tl-row{display:flex;align-items:center;gap:10px;padding:7px 16px;border-bottom:1px solid var(--border-ll);animation:slideIn .3s}

.tl-row:hover{background:#f7f9fc}
.tl-c1{width:72px;flex:none;position:relative}
.tl-c2{width:56px;flex:none}
.tl-c3{width:130px;flex:none}
.tl-c4{flex:1;color:var(--t2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-c5{width:84px;flex:none;color:var(--t3)}
.tl-c6{width:56px;flex:none;text-align:right}
.type-tag{cursor:pointer}
.type-tag:hover{filter:brightness(.96);box-shadow:0 0 0 1.5px rgba(64,158,255,.35)}
.st-ic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.st-ic.wait{background:var(--warn-l);color:var(--warn)}
.st-ic.ok{background:var(--ok-l);color:var(--ok)}
.spin-sm{width:12px;height:12px;border:2px solid var(--warn-b);border-top-color:var(--warn);border-radius:50%;animation:rot .8s linear infinite}

/* ================= 页面：场景编辑（时间线为主） ================= */
.ed-head{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:12px}
.ed-title{font-size:16px;font-weight:600}
.ed-users{display:flex;gap:8px}
.ed-head .grow{flex:1}
.ed-tools{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.fchip{height:26px;padding:0 12px;border-radius:13px;font-size:12.5px;color:var(--t2);border:1px solid var(--border);background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:4px}

.fchip.on{background:var(--p);border-color:var(--p);color:#fff}
.ed-tools .inp{width:200px;height:30px}
.ed-tools .hint-r{margin-left:auto;font-size:12px;color:var(--t4)}
.steps-card{margin-bottom:16px}
.batch-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;background:var(--p-l);border-bottom:1px solid var(--p-b);padding:9px 16px;font-size:13px;color:#3273c4;border-radius:8px 8px 0 0}
.batch-bar b{font-weight:700}
/* Git 图风格竖向时间线（参考 IDEA 提交历史） */
.gscroll{max-height:calc(100vh - 250px);overflow-y:auto}
.gwrap{position:relative;padding:0 14px 10px}
.gheads{position:sticky;top:0;z-index:7;height:48px;background:#fff;border-bottom:1px solid var(--border-l);margin:0 -14px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:10px}
.gheads .gh{display:flex;align-items:center;gap:6px;background:#fff;padding:3px 10px;border-radius:14px;border:1px solid var(--border-l);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.gheads .gh .dev{color:var(--t3);font-size:11.5px}
.glines{position:absolute;top:48px;bottom:0;left:0;right:0;pointer-events:none}
.glines .ln{position:absolute;top:0;bottom:0;width:8px;border-radius:4px;opacity:.42;transform:translateX(-50%)}
.grow{position:relative;margin:10px 0;cursor:pointer}
.grow.side-l .gcard{margin-left:auto;margin-right:calc(50% + 70px)}
.grow.side-r .gcard{margin-left:calc(50% + 70px);margin-right:auto}
.grow.sel-b .gcard{border-color:var(--p);background:var(--p-l)}
.grow.dis .gcard{opacity:.5}
.gdot{position:absolute;top:50%;transform:translate(-50%,-50%);left:0;width:13px;height:13px;border-radius:50%;background:#fff;border:3.5px solid var(--p);z-index:2}
.gdot.sq{border-radius:3px}
.gtick{position:absolute;top:50%;transform:translateY(-50%);height:0;border-top:2px dashed var(--p);opacity:.45;z-index:1}
.gcard{display:flex;align-items:center;gap:12px;width:fit-content;min-width:300px;max-width:calc(50% - 84px);background:#fff;border:1px solid var(--border-l);border-radius:10px;padding:10px 14px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;z-index:1}
.gcard:hover{border-color:var(--p-b);box-shadow:0 4px 14px rgba(64,158,255,.13)}
.gcard .sthumb{cursor:zoom-in;position:relative;flex:none}
.gcard .no-sh{width:72px;height:41px;border-radius:4px;background:var(--info-l);border:1px dashed var(--t4);display:flex;align-items:center;justify-content:center;color:var(--t4)}
.gcard .smeta{flex:1;min-width:0}
.gcard .r1{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.gcard .r1 .n{font-family:var(--mono);font-size:11px;color:var(--t4);font-weight:700}
.gcard .r2{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .sops{display:none;gap:2px;flex:none}
.gcard:hover .sops{display:flex}
.op{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--t3);cursor:pointer}
.op:hover{background:var(--p-l);color:var(--p)}
.op.dg:hover{background:var(--dg-l);color:var(--dg)}
.src-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--t4)}
.empty-tip{padding:40px;text-align:center;color:var(--t4);font-size:13px}
/* 抽屉 */
.drawer{position:fixed;top:0;right:-580px;width:560px;bottom:0;background:#fff;box-shadow:-10px 0 34px rgba(0,0,0,.14);z-index:600;transition:right .22s ease;display:flex;flex-direction:column}
.drawer.open{right:0}
.dw-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-l);flex:none}
.dw-head .tt{font-weight:600;font-size:15px}
.dw-body{flex:1;overflow-y:auto;padding:16px 18px}
.dw-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border-l);flex:none}
.dw-stage{background:#eef1f6;border-radius:8px;padding:12px;margin-bottom:14px}
.dw-footbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.prop-sec{margin-bottom:18px}
.prop-sec .ps-t{font-size:12px;color:var(--t3);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.prop-sec .ps-t .line{flex:1;height:1px;background:var(--border-l)}
.vitem{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--warn-l);border:1px solid var(--warn-b);border-radius:6px;margin-bottom:6px;font-size:12.5px;color:var(--t2)}
.vitem .vi-x{margin-left:auto;color:var(--t3);cursor:pointer;display:flex}
.vitem .vi-x:hover{color:var(--dg)}
/* 灯箱 */
.lb-ov{position:fixed;inset:0;background:rgba(10,14,22,.82);z-index:950;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:fadeIn .15s}
.lb-cap{color:#cfd6e0;font-size:13px;display:flex;align-items:center;gap:12px}
.lb-img{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:5px;padding:2px;gap:2px}
.seg .sg{height:24px;padding:0 12px;border-radius:4px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;border:none;background:none;color:#cfd6e0}
.seg .sg.on{background:#fff;color:var(--p);font-weight:600}
.seg.light .sg{color:var(--t2)}
.seg.light{background:var(--info-l)}
.seg.light .sg.on{color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.hz{position:absolute;border:1.5px dashed rgba(64,158,255,.75);background:rgba(64,158,255,.10);border-radius:3px;cursor:pointer;z-index:4}
.hz:hover{background:rgba(64,158,255,.22)}
.hz.sel{border-style:solid;border-color:var(--p);background:rgba(64,158,255,.22);box-shadow:0 0 0 2px rgba(64,158,255,.25)}
.hz .hzl{position:absolute;top:-18px;left:-1.5px;background:var(--p);color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.kv{display:flex;align-items:center;font-size:12.5px;color:var(--t2);margin-bottom:6px;gap:8px}
.kv .k{color:var(--t3);width:110px;flex:none}
/* 原型导航 */
.proto-nav{position:fixed;right:16px;bottom:16px;background:#fff;border:1px solid var(--border-l);border-radius:10px;box-shadow:var(--shadow-lg);padding:8px;z-index:700;display:flex;flex-direction:column;gap:5px}

.proto-nav .pn{height:28px;padding:0 12px;border-radius:6px;font-size:12px;color:var(--t2);border:none;background:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.proto-nav .pn:hover{background:var(--p-l);color:var(--p)}

<div class="app">

              <th style="width:130px">最近更新</th><th style="width:230px;text-align:right">操作</th>
            </tr></thead>
            <tbody id="scene-rows"></tbody>
          </table>
          <div class="page-foot">
            <span>共 4 条</span><span class="pg">‹</span><span class="pg on">1</span><span class="pg">›</span>
          </div>
        </div>
      </section>

      <!-- ============ 视图：录制工作台 ============ -->
      <section class="view" id="view-record">
        <div class="card rec-topbar">
          <span class="btn text" style="padding:0" id="rec-back"></span>
          <span class="rec-title" id="rec-title">会议等候室功能</span>

          <button class="btn dg" id="btn-stop"></button>

        <div class="utabs" id="utabs"></div>
        <div class="card panel">
          <div class="panel-h" id="panel-head"></div>
          <div class="panel-body" id="panel-cur"><div class="fit" data-fit="contain"></div></div>
        </div>
        <div class="card rec-actions">
          <button class="btn pri" id="btn-insert-step" title="一次性截取全部设备当前画面，插入一个步骤节点"></button>
          <span class="hint">场景里 A 操作后、B 收到了提示？点这里一次截取<b>全部设备</b>画面插入步骤，不用切换 Tab 抢时间 · 新步骤自动出现在下方操作流最顶部</span>
        </div>
        <div class="card timeline-card">
          <div class="tl-head"><span class="tt">操作流</span><span class="cnt" id="tl-cnt"></span>
            <span style="margin-left:auto;font-size:12px;color:var(--t4)">点击操作类型标签可重新归类（OCR / 图片 / 坐标 / 输入…）· 每次操作自动截取操作前画面 · 需要操作后画面请点上方「插入步骤」</span>
          </div>
          <div class="tl-body">
            <table class="tbl"><thead><tr>
              <th style="padding-left:16px">截图</th><th style="width:56px">用户</th><th style="width:130px">操作</th><th>内容</th><th style="width:84px">时间</th><th style="width:70px;text-align:right;padding-right:16px">状态</th>
            </tr></thead><tbody id="tl-rows"></tbody></table>
          </div>
        </div>
      </section>

      <!-- ============ 视图：场景编辑 ============ -->
      <section class="view" id="view-editor">
        <div class="card ed-head">
          <span class="btn text" style="padding:0" id="ed-back"></span>
          <span class="ed-title" id="ed-title">会议等候室功能</span>
          <div class="ed-users" id="ed-users"></div>
          <span class="tag sm t-gray" id="ed-save-state">已保存 · 刚刚</span>
          <div class="grow"></div>
          <button class="btn" id="btn-insert-aw"></button>
          <button class="btn" id="btn-undo" title="Ctrl+Z"></button>
          <button class="btn" id="btn-export"></button>
          <button class="btn pri" id="btn-save">保存</button>
        </div>
        <div class="card ed-tools">
          <span id="ed-filters"></span>
          <input class="inp" id="ed-search" placeholder="搜索步骤内容 / 目标">
          <span class="hint-r">点击缩略图看大图 · 点击类型标签改归类 · 勾选步骤可批量操作</span>
        </div>
        <div class="card steps-card">
          <div id="batch-slot"></div>
          <div id="ed-list" class="gscroll"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="drawer-root"></div>
<div id="lightbox-root"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div class="proto-nav" id="proto-nav">
  <div class="pn-t">原型导航</div>
  <button class="pn" data-go="list">1 · 场景列表</button>
  <button class="pn" data-go="record">2 · 录制工作台</button>
  <button class="pn" data-go="editor">3 · 场景编辑</button>
</div>

function setPanelBy(panelBodyId,v){
  const body=document.getElementById(panelBodyId);
  if(!body)return;
  const host=body.querySelector('.fit');
  host.innerHTML=`<div class="scr-in">${SCREEN[v]?SCREEN[v]():''}</div>`;
  fitAll(body.parentElement);
}
function fitAll(root=document){
  root.querySelectorAll('.fit').forEach(el=>{
    const parent=el.parentElement;
    const w=parent.clientWidth,h=parent.clientHeight;
    if(!w)return;
    const inner=el.querySelector('.scr-in');if(!inner)return;
    const mode=el.dataset.fit||'width';
    const s=mode==='contain'?Math.min(w/480,h/270):w/480;
    inner.style.transform=`scale(${s})`;
    el.style.width=(480*s)+'px';
    el.style.height=(270*s)+'px';
  });
}
window.addEventListener('resize',()=>fitAll());

};
const SUB_LABEL={ocr_wait:'等待出现',ocr_assert:'断言存在',image_assert:'断言图片存在',ocr_exist:'存在检查',image_exist:'图片存在检查'};
const TYPE_MENU=[
  {group:'点击'},{k:'ocr_click'},{k:'image_click'},{k:'click'},
  {group:'输入'},{k:'ocr_input'},{k:'input'},{k:'paste'},
  {group:'手势 / 按键'},{k:'swipe'},{k:'scroll'},{k:'press'},
  {group:'验证（回放时作为断言）'},{k:'ocr_wait'},{k:'ocr_assert'},{k:'image_assert'},{k:'ocr_exist'},
  {group:'应用 / 系统'},{k:'start_app'},{k:'stop_app'},{k:'cmd_exec'},{k:'navigate'},{k:'wait'},
];
function showTypeMenu(anchor,onPick){
  showPop(anchor,TYPE_MENU.map(it=>it.group?{group:it.group}:{k:it.k,label:TYPES[it.k].label+(TYPES[it.k].v?' ⚑':''),icon:TYPES[it.k].icon,onClick:()=>onPick(it.k)}));
}
function applyType(t,k){
  if(TYPES[k]&&TYPES[k].v){t.type='verify';t.sub=k;if(!t.timeout)t.timeout=5}
  else{t.type=k;if('sub' in t)delete t.sub}
}
function contentFor(s){
  if(s.type==='verify')return `${SUB_LABEL[s.sub]||s.sub}「${s.target||''}」${s.timeout?' · '+s.timeout+'s':''}`;
  if(s.type==='ocr_click')return s.target?`OCR 点击「${s.target}」`:`坐标点击 (${s.x??512},${s.y??384})`;
  if(s.type==='image_click')return `图片点击「${s.target||s.tpl||'模板'}」`;
  if(s.type==='click')return `坐标点击 (${s.x??512},${s.y??384})`;
  if(s.type==='ocr_input'||s.type==='input')return `「${s.target||'输入框'}」= ${s.value||''}`;
  if(s.type==='paste')return '粘贴剪贴板内容';
  if(s.type==='swipe')return `滑动 (${s.fx??200},${s.fy??200} → ${s.tx??400},${s.ty??400})`;
  if(s.type==='scroll')return `滚动 ${s.value||3} 格`;
  if(s.type==='press')return `按键 ${s.value||'enter'}`;
  if(s.type==='wait')return `等待 ${s.value||2} 秒`;
  if(s.type==='cmd_exec')return `$ ${s.value||''}`;
  if(s.type==='start_app')return `拉起 ${s.value||'应用'}`;
  if(s.type==='stop_app')return `停止 ${s.value||'应用'}`;
  if(s.type==='navigate')return `打开 ${s.value||'URL'}`;
  return s.content||'';
}

/* ---------- Toast / Pop / Modal ---------- */
let toastT;
function toast(msg,type='ok'){
  const el=$('#toast');
  el.className=type;el.innerHTML=`${ic(type==='ok'?'check':'x')}<span>${msg}</span>`;
  el.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),2200);
}
let popEl=null;
function closePop(){if(popEl){popEl.remove();popEl=null;document.removeEventListener('click',onPopDoc)}}
function onPopDoc(e){if(popEl&&!popEl.contains(e.target))closePop()}
function showPop(anchor,items,opts={}){
  closePop();
  popEl=document.createElement('div');popEl.className='pop';
  popEl.innerHTML=items.map(i=>{
    if(i.group)return `<div class="pg">${i.group}</div>`;
    if(i.div)return '<div class="pdiv"></div>';
    return `<div class="pi ${i.cls||''}" data-k="${i.k||''}" ${i.dis?'data-dis="1"':''}>${i.icon?ic(i.icon):''}<span>${i.label}</span>${i.note?`<span class="pnote" style="padding:0">${i.note}</span>`:''}</div>`;
  }).join('');
  document.body.appendChild(popEl);
  const r=anchor.getBoundingClientRect();
  let top=r.bottom+6,left=r.left;
  if(opts.align==='right')left=r.right-popEl.offsetWidth;
  if(top+popEl.offsetHeight>innerHeight-8)top=r.top-popEl.offsetHeight-6;
  if(left+popEl.offsetWidth>innerWidth-8)left=innerWidth-8-popEl.offsetWidth;
  popEl.style.top=Math.max(8,top)+'px';popEl.style.left=Math.max(8,left)+'px';
  popEl.querySelectorAll('.pi').forEach(p=>p.addEventListener('click',ev=>{
    if(p.dataset.dis){ev.stopPropagation();return}
    const it=items.find(i=>i.k===p.dataset.k);
    closePop();it&&it.onClick&&it.onClick();
  }));
  setTimeout(()=>document.addEventListener('click',onPopDoc),0);
}
function openModal(html,{width=560}={}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="overlay"><div class="modal" style="width:${width}px">${html}</div></div>`;
  root.querySelector('.overlay').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeModal()});
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  return root;
}
function closeModal(){$('#modal-root').innerHTML=''}

function filteredSteps(){
  return steps.filter(s=>{
    if(edFilter==='dis'){if(!s.disabled)return false}
    else if(edFilter!=='all'&&s.user!==edFilter)return false;
    if(edSearch){
      const txt=(contentFor(s)+' '+(s.target||'')+' '+(s.note||'')+' '+(s.value||'')).toLowerCase();
      if(!txt.includes(edSearch.toLowerCase()))return false;

  });

const USER_COLORS={A:'#409EFF',B:'#67C23A',C:'#8B5CF6',D:'#E6A23C',E:'#00A6A6'};

function renderRows(){
  const list=filteredSteps();

  const users=[...new Set(list.map(s=>s.user))].sort();
  const n=users.length;

  const lines=users.map((u,i)=>`<div class="ln" style="left:calc(50% + ${off(i)}px);background:${USER_COLORS[u]||'#909399'}"></div>`).join('');
  const rows=list.map(s=>{
    const o=off(users.indexOf(s.user));
    const side=o<0?'side-l':'side-r';
    const c=USER_COLORS[s.user]||'#909399';
    const t=TYPES[s.type];
    const tagCls=s.type==='verify'?'t-orange':t.cls;
    const tagLabel=s.type==='verify'?'验证点':t.label;
    const vc=verifyCount(s);
    const tick=side==='side-l'
      ?`style="left:calc(50% - 70px);width:${70+o}px;border-color:${c}"`

        <span class="checkbox ${selSet.has(s.id)?'on':''}" data-op="check"></span>
        <span class="sthumb" data-op="zoom">${s.shot?thumb(s.shot,72):`<span class="no-sh">${ic('terminal',16)}</span>`}${s.multi?`<span class="mshot">${s.multi}</span>`:''}</span>
        <div class="smeta">
          <div class="r1">
            <span class="n">${String(s.id).padStart(2,'0')}</span>
            <span class="ubadge ${uCls(s.user)}">${s.user}</span>
            <span class="tag sm ${tagCls} type-tag" data-op="type" title="点击重新归类">${ic(s.type==='verify'?TYPES[s.sub||'ocr_assert'].icon:t.icon,10)}${tagLabel}</span>
            ${s.source==='insert'?'<span class="src-chip">· 手动插入</span>':''}
            ${s.source==='verify'?'<span class="src-chip">· 验证</span>':''}
            ${vc?`<span class="tag sm t-orange">${ic('flag',10)}${vc}</span>`:''}
            ${s.disabled?'<span class="tag sm t-red">已禁用</span>':''}
          </div>
          <div class="r2">${contentFor(s)}${s.note?` <span style="color:var(--t4)">— ${s.note}</span>`:''}</div>
        </div>
        <div class="sops">
          <span class="op" data-op="edit" title="编辑">${ic('edit',14)}</span>
          <span class="op" data-op="up" title="上移">${ic('chevU',14)}</span>
          <span class="op" data-op="down" title="下移">${ic('chevD',14)}</span>
          <span class="op" data-op="dis" title="${s.disabled?'启用':'禁用'}">${ic(s.disabled?'eye':'eyeoff',14)}</span>
          <span class="op dg" data-op="del" title="删除">${ic('trash',14)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  wrap.innerHTML=`<div class="gwrap"><div class="gheads">${heads}</div><div class="glines">${lines}</div>${rows}</div>`;
  $$('#ed-list .grow').forEach(el=>{
    el.addEventListener('click',e=>{
      const op=e.target.closest('[data-op]');
      const sid=+el.dataset.sid;
      if(!op){openDrawer(sid);return}
      const s=steps.find(x=>x.id===sid);
      const kind=op.dataset.op;
      if(kind==='check'){
        selSet.has(sid)?selSet.delete(sid):selSet.add(sid);
        renderRows();renderBatchBar();
      }else if(kind==='zoom')openLightbox(sid);
      else if(kind==='type'){
        e.stopPropagation();
        showTypeMenu(op,k=>{
          pushHist();applyType(s,k);
          renderRows();if(drawerSid===sid)renderDrawer();
          toast(`步骤 ${String(sid).padStart(2,'0')} 已归类为：${TYPES[s.type==='verify'?s.sub:s.type].label}`);
        });
      }else if(kind==='edit')openDrawer(sid);
      else if(kind==='up'||kind==='down'){
        pushHist();
        const idx=steps.indexOf(s),to=kind==='up'?idx-1:idx+1;
        if(to<0||to>=steps.length){toast('已经到边界了','err');return}
        steps.splice(to,0,steps.splice(idx,1)[0]);
        renderRows();
      }else if(kind==='dis'){
        pushHist();s.disabled=!s.disabled;renderRows();
        toast(s.disabled?'步骤已禁用（导出时标注为跳过）':'步骤已启用');
      }else if(kind==='del'){
        pushHist();steps=steps.filter(x=>x.id!==sid);
        if(drawerSid===sid)closeDrawer();
        renderFilters();renderRows();renderBatchBar();
        toast('步骤已删除（Ctrl+Z 撤销）');
      }
    });
  });
}

    body+=`<div class="frm-row"><div class="frm-lab">命令</div><textarea class="inp mono" rows="3">${s.value||''}</textarea></div>
    <div class="frm-row" style="display:flex;align-items:center;gap:10px"><span class="switch on"></span><span style="font-size:13px;color:var(--t2)">后台执行（不阻塞后续步骤）</span></div>
    <div class="frm-hint" style="margin-bottom:14px">${ic('terminal',13)}支持 @tools/ 占位符指向 worker tools 目录</div>`;
  }
  if(s.type==='verify'){
    body+=`<div style="display:flex;gap:12px;margin-bottom:14px">
      <div style="flex:1"><div class="frm-lab">验证方式</div><div class="sel" style="width:100%">${s.sub}${ic('chevD',13)}</div></div>
      <div style="flex:1"><div class="frm-lab">超时 (秒)</div><input class="inp" value="${s.timeout||5}"></div></div>
    <div class="frm-row"><div class="frm-lab">目标</div><input class="inp" value="${s.target||''}" id="pf-target"></div>
    <div class="frm-row" style="display:flex;align-items:center;gap:10px"><span class="switch"></span><span style="font-size:13px;color:var(--t2)">取反（断言不存在）</span></div>`;
  }
  if(s.type==='manual'){
    body+=`<div class="frm-hint" style="margin-bottom:10px">${ic('camera',13)}快照/手动节点：作为界面证据保留，可转为验证点或等待</div>
    <div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn sm" id="pf-tov">${ic('flag',12)}转为验证点</button><button class="btn sm" id="pf-tow">${ic('hourglass',12)}转为等待</button></div>`;
  }
  const vs=s.verify||[];
  body+=`<div class="prop-sec"><div class="ps-t">验证点 <span class="line"></span><button class="btn text sm" id="pf-addv" style="height:22px">${ic('plus',12)}添加</button></div>
    ${vs.length?vs.map((v,i)=>`<div class="vitem">${ic('flag',13)}<span class="mono" style="font-size:11.5px;color:var(--warn)">${v.sub}</span><span>「${v.target}」${v.timeout?v.timeout+'s':''}</span><span class="vi-x" data-vi="${i}">${ic('x',13)}</span></div>`).join(''):'<div style="font-size:12px;color:var(--t4)">暂无验证点 — 导出文档时将标注为 EXPECT 步骤</div>'}
  </div>`;
  body+=`<div class="frm-row" style="margin-bottom:4px"><div class="frm-lab">备注 <span style="color:var(--t4);font-weight:400;font-size:12px">（生成用例时合并进步骤描述）</span></div><textarea class="inp" rows="2" placeholder="补充说明">${s.note||''}</textarea></div>`;
  return body;
}
function bindPropForm(s){
  const tt=$('#pf-type');
  if(tt)tt.addEventListener('click',e=>{
    showTypeMenu(e.currentTarget,k=>{
      pushHist();applyType(s,k);renderDrawer();renderRows();
      toast(`已归类为：${TYPES[s.type==='verify'?s.sub:s.type].label}`);
    });
  });
  $$('[data-cand]').forEach(c=>c.addEventListener('click',()=>{const inp=$('#pf-target');if(inp){inp.value=c.dataset.cand;s.target=c.dataset.cand;renderRows();renderDrawer()}}));
  const pv=$('#pf-target');if(pv)pv.addEventListener('input',()=>{s.target=pv.value;renderRows()});
  const av=$('#pf-addv');if(av)av.onclick=()=>{pushHist();(s.verify=s.verify||[]).push({sub:'ocr_wait',target:s.target||'',timeout:5});renderDrawer();renderRows()};
  $$('[data-vi]').forEach(x=>x.addEventListener('click',()=>{pushHist();s.verify.splice(+x.dataset.vi,1);renderDrawer();renderRows()}));
  const tv=$('#pf-tov');if(tv)tv.onclick=()=>{pushHist();s.type='verify';s.sub='ocr_assert';renderDrawer();renderRows()};
  const tw=$('#pf-tow');if(tw)tw.onclick=()=>{pushHist();s.type='wait';s.value='2';renderDrawer();renderRows()};
  const rt=$('#pf-retpl');if(rt)rt.onclick=()=>toast('进入框选模式（模拟）');
}
/* ---------- 灯箱 ---------- */
function openLightbox(sid){lbSid=sid;renderLightbox()}
function closeLightbox(){lbSid=null;$('#lightbox-root').innerHTML=''}
function renderLightbox(){
  const s=steps.find(x=>x.id===lbSid);
  if(!s){closeLightbox();return}
  const shot=s.shot;
  const t=TYPES[s.type==='verify'?(s.sub||'ocr_assert'):s.type];
  $('#lightbox-root').innerHTML=`<div class="lb-ov" id="lb-ov">
    <div class="lb-cap">
      <span class="mono">STEP ${String(s.id).padStart(2,'0')}</span>
      <span class="ubadge ${s.user.toLowerCase()}">${s.user}</span>
      <span>${t.label}</span>
      <span style="color:#8a93a2">${contentFor(s)}</span>
    </div>
    <div class="lb-img" id="lb-img"><div class="fit"><div class="scr-in">${SCREEN[shot]?SCREEN[shot]():''}</div></div></div>
    <div style="color:#8a93a2;font-size:12px">点击空白处或按 Esc 关闭</div>
  </div>`;
  const img=$('#lb-img');
  img.style.width=Math.min(920,innerWidth*0.72)+'px';
  fitAll($('#lightbox-root'));
  $('#lb-ov').addEventListener('click',e=>{if(e.target.id==='lb-ov'||e.target.id==='lb-img')closeLightbox()});
}
/* ---------- 插入 AW 弹窗 ---------- */
const INSERT_META={
  cmd_exec:{title:'插入 · 命令行 cmd_exec',icon:'terminal',fields:()=>`
    ${propRow('命令 <span class="req">*</span>',`<textarea class="inp mono" rows="3" id="ins-val" placeholder="例如：@tools/init_audio.ps1　或　net stop xxx"></textarea>`)}
    <div class="frm-row" style="display:flex;align-items:center;gap:10px"><span class="switch on"></span><span style="font-size:13px;color:var(--t2)">后台执行</span></div>`},
  start_app:{title:'插入 · 拉起应用 start_app',icon:'package',fields:()=>`
    ${propRow('包名 / 应用路径 <span class="req">*</span>',`<input class="inp mono" id="ins-val" placeholder="Android/iOS 填包名，Windows 填 exe 路径">`)}`},
  stop_app:{title:'插入 · 停止应用 stop_app',icon:'x',fields:()=>propRow('包名 / 应用名 <span class="req">*</span>',`<input class="inp mono" id="ins-val">`)},
  navigate:{title:'插入 · 打开网页 navigate',icon:'globe',fields:()=>propRow('URL <span class="req">*</span>',`<input class="inp mono" id="ins-val" placeholder="https://">`)},
  press:{title:'插入 · 按键 press',icon:'keyboard',fields:()=>propRow('按键 <span class="req">*</span>',`<input class="inp mono" id="ins-val" placeholder="enter / esc / tab / ctrl+c">`)},
  wait:{title:'插入 · 等待 wait',icon:'hourglass',fields:()=>propRow('时长 (秒)',`<input class="inp" id="ins-val" value="3" style="width:120px">`)},
};
function propRow(label,ctrl){return `<div class="frm-row"><div class="frm-lab">${label}</div>${ctrl}</div>`}
function openInsertModal(kind){
  const m=INSERT_META[kind];
  openModal(`
    <div class="m-head">${ic(m.icon,18)} ${m.title}<span class="x" data-close>${ic('x')}</span></div>
    <div class="m-body">
      <div class="frm-row"><div class="frm-lab">插入位置</div>
        <div class="sel" style="width:240px">时间线末尾 ${ic('chevD',13)}</div>
        <div class="frm-hint">插入后可在时间线上用 ↑↓ 调整顺序</div></div>
      <div class="frm-row"><div class="frm-lab">归属用户</div>
        <div style="display:flex;gap:8px">
          <span class="uchip a" style="cursor:pointer"><span class="u-dot" style="background:var(--p)"></span>userA · web</span>
          <span class="uchip b" style="cursor:pointer;opacity:.45"><span class="u-dot" style="background:var(--ok)"></span>userB · windows</span>
        </div></div>
      ${m.fields()}
    </div>
    <div class="m-foot"><button class="btn" data-close>取消</button><button class="btn pri" id="ins-ok">插入步骤</button></div>`,{width:520});
  $('#ins-ok').addEventListener('click',()=>{
    const val=$('#ins-val')?$('#ins-val').value:'';
    if(!val){toast('请填写必填项','err');return}
    pushHist();
    const ns={id:Date.now()%100000,user:'A',type:kind,value:val,shot:null,source:'insert'};
    steps.push(ns);
    closeModal();renderFilters();renderRows();updUndoBtn();
    toast('已插入步骤：'+TYPES[kind].label+'（时间线末尾，可 ↑↓ 调序）');
    const el=$(`#ed-list .grow[data-sid="${ns.id}"]`);el&&el.scrollIntoView({block:'center',behavior:'smooth'});
  });
}
/* ---------- 快捷键 ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(lbSid){closeLightbox();return}
    if($('#modal-root').innerHTML){closeModal();return}
    if(drawerSid){closeDrawer();return}
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&curView==='editor'&&!e.shiftKey){
    const tag=document.activeElement.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA')return;
    e.preventDefault();undo();
  }
});

/* ---------- 启动 ---------- */
$('#bell').innerHTML=ic('bell',17);
$('#btn-search').addEventListener('click',()=>toast('搜索（模拟）'));
renderSidebar();
renderList();
go('list');
setTimeout(()=>toast('原型 v2 · 已按反馈更新：列表精简+导出 / 工作台Tab+插入步骤 / 编辑器时间线为主+批量+撤销'),400);
</script>
</body>
