
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip on;
  # gzip_buffers 32 16k;
  # gzip_comp_level 6;
  # gzip_min_length 1k;
  # gzip_static on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  # 免鉴权执行类接口（deploy / collect start|stop）单 IP 限流：平均 0.5 次/秒，
  # burst=10 允许短时突发。仅限制匿名执行类调用，页面其余 API 不受影响。
  limit_req_zone $binary_remote_addr zone=external_exec_api:10m rate=30r/m;

  server {
    listen 8080;
    server_name localhost;

    # 免鉴权执行类接口限流：精确匹配优先于下方 /basic-api/ 前缀代理，逐个单独放行。
    # 超限返回 429。如需进一步限定来源网段，按部署环境取消 allow/deny 注释并调整网段。
    location = /basic-api/api/core/config-template/deploy {
      # allow 192.168.0.0/16;
      # deny all;
      limit_req zone=external_exec_api burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://backend:8000/api/core/config-template/deploy;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /basic-api/api/core/performance-monitor/collect/start {
      # allow 192.168.0.0/16;
      # deny all;
      limit_req zone=external_exec_api burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://backend:8000/api/core/performance-monitor/collect/start;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /basic-api/api/core/performance-monitor/collect/stop {
      # allow 192.168.0.0/16;
      # deny all;
      limit_req zone=external_exec_api burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://backend:8000/api/core/performance-monitor/collect/stop;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 代理
    location /basic-api/ {
      proxy_pass http://backend:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /ws {
      proxy_pass http://backend:8000/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 测试报告代理
    location /test-reports-html/ {
      proxy_pass http://backend:8000/test-reports-html/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      # Enable CORS
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }
    }

    # index.html 禁止缓存：发版后浏览器必须拉取新页面，避免引用已删除的旧 JS/CSS
    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
      add_header 'Access-Control-Allow-Origin' '*';
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
